server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para estáticos versionados, corto para index.html.
    location ~* \.(?:css|js|svg|woff2?|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
