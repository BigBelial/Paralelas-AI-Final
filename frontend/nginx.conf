server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dev: NO cachear estáticos (en producción usar tags inmutables + max-age).
    location ~* \.(?:css|js|svg|woff2?|png|jpg|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}
