# Configuración del análisis estático de SonarCloud.
# El escaneo se dispara desde .github/workflows/ci.yml con sonarqube-scan-action,
# no con el plugin del marketplace de GitHub.

# Identificadores del proyecto en SonarCloud (ajustar a los reales del grupo).
sonar.projectKey=mancala-kalah
sonar.organization=Juan Jose Ospina Sanchez

sonar.projectName=Motores Paralelos de Mancala (Kalah)
sonar.projectVersion=0.2.0

# Código fuente que se analiza.
sonar.sources=motor/src,backend/app,frontend/public

# Código de pruebas (no cuenta como deuda de la aplicación).
sonar.tests=motor/tests,backend/tests

# Rutas excluidas del análisis (artefactos, dependencias, build).
sonar.exclusions=**/build/**,**/node_modules/**,**/__pycache__/**

# Codificación de los fuentes.
sonar.sourceEncoding=UTF-8
